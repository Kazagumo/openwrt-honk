name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: '标记为预发布版本'
        type: boolean
        default: false
      candidate:
        description: '只构建候选包，不更新正式软件源'
        type: boolean
        default: false
      auto_publish:
        description: '完整矩阵成功后自动推进 main 并发布正式版'
        type: boolean
        default: true
      base_sha:
        description: '自动推进时预期的 main SHA'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HONK_SOURCE_TAG: source-${{ github.run_id }}

concurrency:
  group: honk-release-pipeline
  cancel-in-progress: false

jobs:
  doona:
    name: Build and publish Doona
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check package metadata and scripts
        run: bash scripts/check.sh
      - name: Build Doona interface
        run: ci/build-doona.sh
      - name: Verify pinned Doona archive hash
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v6
        with:
          name: doona-source
          path: |
            artifacts/cache/doona-*.tar.gz
            luci-app-honk/generated-doona-stage.mk
          if-no-files-found: error

  build-core:
    name: Build honk-core (multi-arch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep zstd

      - name: Build honk-core (multi-arch)
        run: ci/build-core.sh

      - uses: actions/upload-artifact@v6
        with:
          name: core-source
          path: |
            artifacts/cache/honk-core-*.tar.gz
            honk/generated-stage.mk
            honk/generated-provenance.json
          if-no-files-found: error

  publish_source:
    name: Publish isolated source assets
    needs: [doona, build-core]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: source-artifacts
          pattern: '*-source'
      - name: Publish source assets for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(source-artifacts/doona-source/artifacts/cache/*.tar.gz
                 source-artifacts/doona-source/luci-app-honk/generated-doona-stage.mk
                 source-artifacts/core-source/artifacts/cache/*.tar.gz
                 source-artifacts/core-source/honk/generated-stage.mk
                 source-artifacts/core-source/honk/generated-provenance.json)
          for file in "${files[@]}"; do test -s "$file"; done
          if ! gh release view "$HONK_SOURCE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$HONK_SOURCE_TAG" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "Source assets $HONK_SOURCE_TAG" \
              --prerelease --latest=false
          fi
          test "$(gh api "repos/${{ github.repository }}/git/ref/tags/$HONK_SOURCE_TAG" --jq .object.sha)" = "${{ github.sha }}"
          mkdir -p existing-source
          for file in "${files[@]}"; do
            name=${file##*/}
            if gh release view "$HONK_SOURCE_TAG" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$name"; then
              gh release download "$HONK_SOURCE_TAG" --repo "${{ github.repository }}" \
                --pattern "$name" --dir existing-source --clobber
              cmp "$file" "existing-source/$name"
            else
              gh release upload "$HONK_SOURCE_TAG" "$file" --repo "${{ github.repository }}"
            fi
          done